# Deny Deployments that are not digest-pinned, scoped to label digest-pin-enforce=true.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-digest-deployments
  labels:
    app.kubernetes.io/part-of: openshift-security-roadshow
    app.kubernetes.io/component: 301-06-supply
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: "object.spec.template.spec.containers.all(c, c.image.contains('@sha256:'))"
      message: "Deployment rejected: pin every container image to a digest (image@sha256:...)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-digest-deployments
  labels:
    app.kubernetes.io/part-of: openshift-security-roadshow
    app.kubernetes.io/component: 301-06-supply
spec:
  policyName: require-digest-deployments
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        digest-pin-enforce: "true"
