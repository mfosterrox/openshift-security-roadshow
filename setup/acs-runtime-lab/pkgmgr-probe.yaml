# Probe pod for RHACS Red Hat package-manager runtime enforce (microdnf/dnf).
# Restricted-compatible securityContext. Image is UBI minimal from the Red Hat catalog.
apiVersion: v1
kind: Namespace
metadata:
  name: 301-04-runtime
  labels:
    app.kubernetes.io/part-of: openshift-security-roadshow
    app.kubernetes.io/component: 301-04-acs
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe
  namespace: 301-04-runtime
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pkgmgr-probe
  namespace: 301-04-runtime
  labels:
    app: pkgmgr-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pkgmgr-probe
  template:
    metadata:
      labels:
        app: pkgmgr-probe
    spec:
      serviceAccountName: probe
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: registry.access.redhat.com/ubi9/ubi:latest
          command: ["sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
